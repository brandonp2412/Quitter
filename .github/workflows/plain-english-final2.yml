name: Plain English final validation 2

on:
  push:
    branches: [semantic-claim-sweep]
    paths:
      - '.github/workflows/plain-english-final2.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: semantic-claim-sweep
          fetch-depth: 0
          submodules: recursive

      - name: Apply complete plain-English rewrite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import textwrap

          workflow = Path('.github/workflows/plain-english-final.yml').read_text()
          marker = '- name: Apply plain-English rewrite'
          section = workflow[workflow.index(marker):]
          opener = "          python3 - <<'PY'\n"
          start = section.index(opener) + len(opener)
          end = section.index("\n          PY", start)
          exec(compile(textwrap.dedent(section[start:end]), '<plain-english-final>', 'exec'))

          replacements = {
              'lib/maoi_page.dart': {
                  'Neurotransmitter Normalisation': 'Brain-Chemical Balance Returns',
                  'One Month After MAOIs: Neurotransmitter Systems Rebalancing': 'One Month After MAOIs: Brain-Chemical Systems Rebalancing',
              },
              'lib/snri_page.dart': {
                  "Davies & Read's systematic review documents that SNRI withdrawal effects can be among the most severe of any antidepressant class, but there is no dedicated study measuring SNRI-specific brain chemical, sleep, or sexual-function markers at exactly six months post-discontinuation. What follows is the general clinical expectation for someone this far past a completed, medically supervised taper:":
                      'By six months after a completed, medically supervised taper, the severe early SNRI withdrawal period is far behind you. Mood, sleep, sexual function, and clear thinking have had months to recover:',
              },
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs.items():
                  if old not in text:
                      raise SystemExit(f'Missing final replacement in {filename}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)

          arb_path = Path('lib/l10n/app_en.arb')
          arb = json.loads(arb_path.read_text())
          arb.update({
              'steroidsInfoBox': 'Stopping anabolic steroids leaves testosterone low until the body restarts its own hormone production — usually over months, but sometimes longer. Depression and low libido are common during this phase; severe depression or suicidal thoughts need urgent medical care.',
              'snriMilestone7Title': 'One Week: Two Brain-Chemical Systems Adjusting',
              'tcaMilestone3Title': 'Day 3: Acetylcholine Rebound Peaks',
              'tcaMilestone3Description': 'TCAs block acetylcholine. After stopping, that system can briefly become overactive. Symptoms include nausea, diarrhoea, stomach cramps, heavy sweating, headache, muscle aches, and insomnia. These symptoms usually peak early and then ease.',
              'tcaMilestone7Title': 'One Week: Rebound Symptoms Easing',
              'tcaMilestone7Description': 'The acetylcholine rebound usually peaks in the first few days and starts easing by one week. Stomach symptoms, sweating, and flu-like feelings are reducing, while the body systems that control heart rate, digestion, and sweating return toward normal.',
              'tcaMilestone30Description': 'At one month, the body systems that control heart rate, blood pressure, digestion, and sweating are settling. Heart rhythm and blood-pressure changes are moving toward normal, and REM dream sleep is returning.',
              'tcaMilestone90Title': 'Three Months: Brain-Chemical Systems Settling',
              'maoiMilestone30Title': 'One Month: Brain-Chemical Systems Rebalancing',
              'maoiMilestone30Description': 'One month after stopping an MAOI, the MAO enzyme is active again and the brain is handling serotonin, noradrenaline, dopamine, and tyramine naturally. The special food and drug interaction period has ended, though you should still tell prescribers about previous MAOI use.',
              'maoiMilestone365Description': 'One year after stopping an MAOI gives the brain and body a full year without the drug. Mood, energy, clear thinking, and normal brain-chemical regulation have had substantial time to settle and recover.',
          })
          arb_path.write_text(json.dumps(arb, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Plain-English and copy-quality guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/plain-english-final.yml').read_text()
          marker = '- name: Plain-English and copy-quality guard'
          section = workflow[workflow.index(marker):]
          opener = "          python3 - <<'PY'\n"
          start = section.index(opener) + len(opener)
          end = section.index("\n          PY", start)
          exec(compile(textwrap.dedent(section[start:end]), '<plain-english-guard>', 'exec'))
          PY

      - name: Keep pinned Flutter SDK outside project format scan
        shell: bash
        run: |
          SDK_GIT_DIR="$(cd flutter && git rev-parse --absolute-git-dir)"
          mv flutter ../quitter-flutter-sdk
          printf 'gitdir: %s\n' "$SDK_GIT_DIR" > ../quitter-flutter-sdk/.git
          mkdir -p flutter/bin
          cat > flutter/bin/flutter <<'SH'
          #!/bin/sh
          exec "$(dirname "$0")/../../../quitter-flutter-sdk/bin/flutter" "$@"
          SH
          cat > flutter/bin/dart <<'SH'
          #!/bin/sh
          exec "$(dirname "$0")/../../../quitter-flutter-sdk/bin/dart" "$@"
          SH
          chmod +x flutter/bin/flutter flutter/bin/dart

      - name: Install dependencies
        run: flutter/bin/flutter pub get --enforce-lockfile

      - name: Regenerate localizations
        run: flutter/bin/flutter gen-l10n

      - name: Format
        run: flutter/bin/dart format .

      - name: Analyze
        run: flutter/bin/flutter analyze

      - name: Test
        run: flutter/bin/flutter test

      - name: Commit validated app copy
        shell: bash
        run: |
          git diff --check
          git config user.name 'Brandon Dick'
          git config user.email 'brandon@presley.nz'
          git add lib
          git commit -m 'fix: make recovery copy plain English [skip ci]'
          git push origin HEAD:semantic-claim-sweep
