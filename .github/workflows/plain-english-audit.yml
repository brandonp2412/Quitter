      - name: Plain-English guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          banned = [
              'anhedonia', 'dysphoria', 'psychomotor', 'visuo-', 'encephalopathy',
              'allostatic', 'hypodopaminergic', 'spermatogenesis', 'gonadotropins',
              'HPG axis', 'HPTA', 'serotonergic', 'neuropsychological', 'neurocognitive',
              'prefrontal cortex', 'neuroplasticity', 'cognitive fog', 'cognitive impairment',
              'cognitive deficit', 'cognitive dysfunction', 'executive function',
              'receptor sensitivity', 'recalibrat', 'immunosuppressive', 'cytokine',
              'worth being upfront', "can't pin", 'not directly measured',
              'careful not to overstate', 'asks us to be honest', 'honest, headline',
              'does not establish', "doesn't exist", 'no dedicated study',
          ]
          rx = re.compile('|'.join(re.escape(x) for x in banned), re.I)
          escaped_double = re.compile(r'\\".*?\\"')
          single_quote = re.compile(r"(?<!\w)'[^'\n]+'(?!\w)")
          source_segment = re.compile(r'Source:.*?(?=\\n\\n|$)')
          failures = []

          for path in sorted(Path('lib').glob('*_page.dart')):
              in_reference = False
              for n, line in enumerate(path.read_text().splitlines(), 1):
                  if 'referenceContent:' in line:
                      in_reference = True
                  if in_reference:
                      check = source_segment.sub('', line)
                      check = escaped_double.sub('', check)
                      check = single_quote.sub('', check)
                      if rx.search(check):
                          failures.append(f'{path}:{n}: {check.strip()}')
                  if in_reference and line.strip() == '),':
                      in_reference = False

          arb = json.loads(Path('lib/l10n/app_en.arb').read_text())
          for key, value in arb.items():
              if key.startswith('@') or not isinstance(value, str):
                  continue
              if rx.search(value):
                  failures.append(f'app_en.arb:{key}: {value}')

          if failures:
              print('\n'.join(failures))
              raise SystemExit(f'Plain-English guard failed with {len(failures)} remaining jargon/hedge lines')
          print('Plain-English guard passed')
          PY

      - name: Keep pinned Flutter SDK outside project format scan
        shell: bash
        run: |
          SDK_GIT_DIR="$(cd flutter && git rev-parse --absolute-git-dir)"
          mv flutter ../quitter-flutter-sdk
          printf 'gitdir: %s\n' "$SDK_GIT_DIR" > ../quitter-flutter-sdk/.git
          mkdir -p flutter/bin
          cat > flutter/bin/flutter <<'SH'
          #!/bin/sh
          exec "$(dirname "$0")/../../../quitter-flutter-sdk/bin/flutter" "$@"
          SH
          cat > flutter/bin/dart <<'SH'
          #!/bin/sh
          exec "$(dirname "$0")/../../../quitter-flutter-sdk/bin/dart" "$@"
          SH
          chmod +x flutter/bin/flutter flutter/bin/dart

      - name: Install dependencies
        run: flutter/bin/flutter pub get --enforce-lockfile

      - name: Regenerate localizations
        run: flutter/bin/flutter gen-l10n

      - name: Format
        run: flutter/bin/dart format .

      - name: Analyze
        run: flutter/bin/flutter analyze

      - name: Test
        run: flutter/bin/flutter test

      - name: Commit validated copy
        shell: bash
        run: |
          git diff --check
          git config user.name 'Brandon Dick'
          git config user.email 'brandon@presley.nz'
          git add lib
          git commit -m 'fix: make recovery copy plain English [skip ci]'
          git push origin HEAD:semantic-claim-sweep
