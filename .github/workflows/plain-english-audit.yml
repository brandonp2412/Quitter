          def transform_fragment(line):
              masks = []
              def mask(match):
                  token = f'__PLAIN_MASK_{len(masks)}__'
                  masks.append((token, match.group(0)))
                  return token
              line = source_segment.sub(mask, line)
              line = escaped_double.sub(mask, line)
              line = single_quote.sub(mask, line)
              for old, new in phrase_replacements:
                  line = line.replace(old, new)
                  if old and old[0].isupper():
                      continue
                  # Also handle sentence-start capitalization for simple words.
                  cap_old = old[:1].upper() + old[1:]
                  cap_new = new[:1].upper() + new[1:]
                  line = line.replace(cap_old, cap_new)
              line = re.sub(r'\bcognition\b', 'thinking and memory', line, flags=re.I)
              line = re.sub(r'\bbaseline\b', 'starting level', line, flags=re.I)
              for token, original in reversed(masks):
                  line = line.replace(token, original)
              return line

