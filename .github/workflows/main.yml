name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "pubspec.yaml"
  workflow_dispatch:

concurrency:
  group: build-and-release-main
  cancel-in-progress: true

env:
  PUB_SUMMARY_ONLY: true
  KOTLIN_VERSION: "2.1.0"

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify lockfile reproducibility
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze code
        run: dart analyze --no-fatal-warnings lib

      - name: Run tests
        run: flutter test

  build-android:
    needs: version-bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.version-bump.outputs.version }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter from submodule
        run: |
          git submodule update --init --recursive flutter
          echo "${{ github.workspace }}/flutter/bin" >> $GITHUB_PATH
          flutter/bin/flutter config --no-analytics

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Decode Android keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Build android
        run: |
          echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties
          flutter build appbundle
          flutter build apk --split-per-abi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: android-builds
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/bundle/release/app-release.aab

  generate-screenshots:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_type: phoneScreenshots
            profile: pixel_6
          - device_type: sevenInchScreenshots
            profile: Nexus 7
          - device_type: tenInchScreenshots
            profile: Nexus 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter from submodule
        run: |
          git submodule update --init --recursive flutter
          echo "${{ github.workspace }}/flutter/bin" >> $GITHUB_PATH
          flutter/bin/flutter config --no-analytics

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate ${{ matrix.device_type }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QUITTER_DEVICE_TYPE: ${{ matrix.device_type }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./scripts/ci_screenshots.sh

      - name: Upload ${{ matrix.device_type }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.device_type }}
          path: fastlane/metadata/android/en-US/images/${{ matrix.device_type }}
          if-no-files-found: error
          retention-days: 7

  patrol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter from submodule
        run: |
          git submodule update --init --recursive flutter
          echo "${{ github.workspace }}/flutter/bin" >> $GITHUB_PATH
          flutter/bin/flutter config --no-analytics

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli 4.6.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Patrol tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: patrol test -t patrol_test/home_screen_widget_test.dart

  version-bump:
    needs: [quality-checks, generate-screenshots, patrol-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      build_number: ${{ steps.bump.outputs.build_number }}
      changelog_number: ${{ steps.bump.outputs.changelog_number }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download phone screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots-phoneScreenshots
          path: fastlane/metadata/android/en-US/images/phoneScreenshots

      - name: Download seven-inch screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots-sevenInchScreenshots
          path: fastlane/metadata/android/en-US/images/sevenInchScreenshots

      - name: Download ten-inch screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots-tenInchScreenshots
          path: fastlane/metadata/android/en-US/images/tenInchScreenshots

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Bump versions and generate changelog
        id: bump
        run: |
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          CURRENT_BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          CURRENT_MSIX=$(grep 'msix_version:' pubspec.yaml | sed 's/.*msix_version: *//')

          IFS='.' read -ra V <<< "$CURRENT_VERSION"
          NEW_VERSION="${V[0]}.${V[1]}.$((${V[2]} + 1))"
          NEW_BUILD=$((CURRENT_BUILD + 1))
          CHANGELOG_NUMBER=$((NEW_BUILD * 10 + 3))

          IFS='.' read -ra M <<< "$CURRENT_MSIX"
          NEW_MSIX="${M[0]}.${M[1]}.$((${M[2]} + 1)).${M[3]}"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$NEW_BUILD" >> "$GITHUB_OUTPUT"
          echo "changelog_number=$CHANGELOG_NUMBER" >> "$GITHUB_OUTPUT"

          sed -i "s/^version: .*/version: $NEW_VERSION+$NEW_BUILD/" pubspec.yaml
          sed -i "s/msix_version: .*/msix_version: $NEW_MSIX/" pubspec.yaml

          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/$CHANGELOG_NUMBER.txt"
          mkdir -p "$(dirname "$CHANGELOG_FILE")"

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            git --no-pager log --pretty=format:'%s' "$LAST_TAG"..HEAD
          else
            git --no-pager log --pretty=format:'%s'
          fi | sort -u \
            | grep -v "^Merge " \
            | grep -v "^Release " \
            | grep -v "^Bump " \
            | grep -v "\[skip ci\]" \
            | grep -v "^ci:" \
            | grep -v "^chore:" \
            | grep -v "^test:" \
            | grep -v "^refactor:" \
            | grep -v "^style:" \
            | grep -v "^docs:" \
            | grep -v "^build:" \
            | grep -v "^Generate " \
            | grep -v "^Format " \
            | grep -v "^Ran " \
            | grep -v "^Run " \
            | grep -v "^Fix tests" \
            | grep -v "^Fix unit tests" \
            | grep -v "^Fix integration" \
            | grep -v "^Fix lint" \
            | grep -v "^Add .*test" \
            | head -10 \
            | sed 's/^feat: //' \
            | sed 's/^fix: /Fix /' \
            | sed 's/^perf: //' \
            | sed 's/^/• /' > "$CHANGELOG_FILE"

          [ -s "$CHANGELOG_FILE" ] || echo "• Bug fixes and improvements" > "$CHANGELOG_FILE"

          TIMESTAMP=$(date +%s)
          ASSET_CHANGELOG="assets/changelogs/$TIMESTAMP.txt"

          DUPLICATE=$(grep -rl "^$(head -1 "$CHANGELOG_FILE" | sed 's/[.[\*^$()+?{|]/\\&/g')$" assets/changelogs/ 2>/dev/null | head -1)
          if [ -z "$DUPLICATE" ]; then
            cp "$CHANGELOG_FILE" "$ASSET_CHANGELOG"
          else
            echo "Skipping duplicate asset changelog (matches $DUPLICATE)"
          fi

      - name: Commit, tag, and push the tested release
        id: release
        run: |
          git add pubspec.yaml fastlane/metadata assets/changelogs/
          git commit -m "Release ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "${{ steps.bump.outputs.version }}"
          git push --atomic origin HEAD:main "refs/tags/${{ steps.bump.outputs.version }}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: version-bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}

      - name: Setup Flutter from submodule
        run: |
          git submodule update --init --recursive flutter
          echo "${{ github.workspace }}/flutter/bin" >> $GITHUB_PATH
          flutter/bin/flutter config --no-analytics

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Build Linux
        run: flutter build linux

      - name: Create Linux zip
        run: |
          cd build/linux/x64/release/bundle
          zip -r quitter-linux.zip .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: linux-builds
          path: build/linux/x64/release/bundle/quitter-linux.zip

  build-windows:
    needs: version-bump
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}

      - name: Setup Flutter from submodule
        run: |
          git submodule update --init --recursive flutter
          echo "${{ github.workspace }}\flutter\bin" >> $env:GITHUB_PATH
          flutter\bin\flutter config --no-analytics

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows

      - name: Create Windows zip
        run: Compress-Archive -Path ./build/windows/x64/runner/Release/* -DestinationPath ./quitter-windows.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: windows-builds
          path: quitter-windows.zip

  build-and-deploy-web:
    needs: version-bump
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}

      - name: Setup Flutter from submodule
        run: |
          git submodule update --init --recursive flutter
          echo "${{ github.workspace }}/flutter/bin" >> $GITHUB_PATH
          flutter/bin/flutter config --no-analytics

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Enable web support
        run: flutter config --enable-web

      - name: Build Flutter web
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create-github-release:
    needs: [version-bump, build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version-bump.outputs.version }}
          name: ${{ needs.version-bump.outputs.version }}
          body_path: fastlane/metadata/android/en-US/changelogs/${{ needs.version-bump.outputs.changelog_number }}.txt
          files: |
            android-builds/flutter-apk/app-*-release.apk
            linux-builds/quitter-linux.zip
            windows-builds/quitter-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-windows-store:
    needs: [version-bump, build-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}

      - name: Setup Flutter from submodule
        run: |
          git submodule update --init --recursive flutter
          echo "${{ github.workspace }}\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          flutter\bin\flutter config --no-analytics

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build MSIX
        run: flutter pub run msix:create

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@v1

      - name: Configure Microsoft Store CLI
        run: msstore reconfigure --tenantId ${{ secrets.AZURE_TENANT_ID }} --clientId ${{ secrets.AZURE_CLIENT_ID }} --clientSecret ${{ secrets.AZURE_CLIENT_SECRET }} --sellerId ${{ secrets.MSSTORE_SELLER_ID }}

      - name: Publish to Microsoft Store
        run: msstore publish --inputDirectory build/windows/x64/runner/Release --appId 9PKVZWDG3FGC || true

  virustotal:
    needs: [create-github-release, version-bump]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: android-builds

      - name: VirusTotal Scan
        id: vt
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            android-builds/flutter-apk/app-arm64-v8a-release.apk
            android-builds/flutter-apk/app-armeabi-v7a-release.apk
            android-builds/flutter-apk/app-x86_64-release.apk

      - name: Append VirusTotal links to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version-bump.outputs.version }}
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          VT_SECTION=$'\n\n<details>\n<summary>VirusTotal Analysis</summary>\n\n'
          IFS=',' read -ra ENTRIES <<< "$ANALYSIS"
          for entry in "${ENTRIES[@]}"; do
            filename=$(basename "${entry%%=*}")
            url="${entry#*=}"
            VT_SECTION+="- [${filename}](${url})"$'\n'
          done
          VT_SECTION+=$'\n</details>'
          CURRENT_BODY=$(gh release view "$VERSION" --json body -q .body)
          gh release edit "$VERSION" --notes "${CURRENT_BODY}${VT_SECTION}"

  deploy-google-play:
    needs: [version-bump, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-builds

      - name: Download phone screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots-phoneScreenshots
          path: fastlane/metadata/android/en-US/images/phoneScreenshots

      - name: Download seven-inch screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots-sevenInchScreenshots
          path: fastlane/metadata/android/en-US/images/sevenInchScreenshots

      - name: Download ten-inch screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots-tenInchScreenshots
          path: fastlane/metadata/android/en-US/images/tenInchScreenshots

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Create Google Play JSON key file
        run: |
          echo '${{ secrets.GOOGLE_PLAY_JSON_KEY }}' > google-play-key.json
          mkdir -p ~/.config
          cp google-play-key.json ~/.config/googlePlay.json

      - name: Deploy to Google Play
        run: |
          bundle exec fastlane android metadata track:production
          bundle exec fastlane supply \
            --aab bundle/release/app-release.aab \
            --json_key google-play-key.json \
            --package_name com.quitter.app \
            --track production \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true
