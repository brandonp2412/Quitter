          for filename, values in updates.items():
            path = Path('lib/l10n') / filename
            data = json.loads(path.read_text(encoding='utf-8'))
            missing = [key for key in values if key not in data]
            if missing:
              raise SystemExit(f'{filename}: missing keys {missing}')
            data.update(values)
            path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          replacements = {
            'https://store.samhsa.gov/sites/default/files/sma14-4859.pdf': 'https://library.samhsa.gov/sites/default/files/sma14-4859.pdf',
            'https://www.mayoclinic.org/diseases-conditions/opioid-use-disorder/symptoms-causes/syc-20375440': 'https://www.mayoclinic.org/diseases-conditions/prescription-drug-abuse/in-depth/how-opioid-addiction-occurs/art-20360372',
          }
          for path in Path('lib').rglob('*.dart'):
            text = path.read_text(encoding='utf-8')
            updated = text
            for old, new in replacements.items():
              updated = updated.replace(old, new)
            if updated != text:
              path.write_text(updated, encoding='utf-8')
          PY
      - name: Regenerate localizations and format
        run: |
          flutter gen-l10n
          dart format lib/quit_milestone.dart lib/pornography_page.dart lib/l10n/generated
      - name: Commit corrected copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/l10n lib/quit_milestone.dart lib/pornography_page.dart lib/entry_page.dart lib/opioid_page.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: replace pornography myths with evidence"
          git push
