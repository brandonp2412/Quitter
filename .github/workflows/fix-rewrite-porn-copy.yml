name: Fix pornography copy workflow

on:
  push:
    paths:
      - .github/workflows/fix-rewrite-porn-copy.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove incompatible lockfile enforcement
        run: |
          sed -i 's/flutter pub get --enforce-lockfile/flutter pub get/' .github/workflows/rewrite-porn-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/rewrite-porn-copy.yml
          git commit -m "ci: let copy rewrite resolve current Flutter packages"
          git push
