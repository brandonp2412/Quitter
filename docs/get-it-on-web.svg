<svg xmlns="http://www.w3.org/2000/svg" width="270" height="80" viewBox="0 0 270 80" role="img" aria-labelledby="title desc">
  <title id="title">Get it on Web</title>
  <desc id="desc">Dark rounded download badge with a purple globe icon and Get it on Web text.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211c27"/>
      <stop offset="1" stop-color="#111015"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eadcff"/>
      <stop offset="1" stop-color="#b994f6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="268" height="78" rx="14" fill="url(#surface)" stroke="#4a4055" stroke-width="2"/>
  <circle cx="43" cy="40" r="25" fill="#d3bcfd" opacity=".10"/>
  <circle cx="43" cy="40" r="20" fill="#d3bcfd" opacity=".12" filter="url(#glow)"/>

  <g transform="translate(23 20)" fill="none" stroke="url(#accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="20" r="16"/>
    <path d="M4.8 20h30.4"/>
    <path d="M20 4c4.5 4.4 7 10 7 16s-2.5 11.6-7 16c-4.5-4.4-7-10-7-16S15.5 8.4 20 4Z"/>
  </g>

  <text x="78" y="31" fill="#c9c3cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="1.7">GET IT ON</text>
  <text x="78" y="57" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="-.35">Web</text>

  <path d="M240 33l7 7-7 7" fill="none" stroke="#d3bcfd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
