analyzer:
  errors:
    analysis_options_deprecated_plugins: ignore
    curly_braces_in_flow_control_structures: ignore
  plugins:
    - custom_lint
  exclude:
    - flutter/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    avoid_print: false

custom_lint:
  rules:
    - no_nested_ternaries
