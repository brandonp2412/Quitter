flutter_launcher_icons:
  image_path: "assets/icon.png"

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#2E4057"
    theme_color: "#e3e3e3"

  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48 # min:48, max:256, default: 48

  macos:
    generate: true
    image_path: "assets/icon.png"
